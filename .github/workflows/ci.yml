name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/check-words.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-macos
          path: dist/
          if-no-files-found: error
