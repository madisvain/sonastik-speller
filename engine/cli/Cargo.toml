[package]
name = "vmspell"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false
description = "Estonian spelling front end for the Vabamorf C ABI"

[[bin]]
name = "vmspell"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
trycmd = "1.2"
